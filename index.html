<!DOCTYPE html>
<html>
<head>
    <title>Nobles Pit 2 - Satellite Overlay</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"
    ></script>
    <style type="text/css">
      body { margin: 0; padding: 0; }
      html, body, #map { width: 100%; height: 100%; }
    </style>
</head>
<body>
<div id="map"></div>
<script>
  var map = L.map('map', { attributionControl: false }).setView([-19.712944, 134.292194], 18);
  L.control.attribution({ prefix: false }).addTo(map);

  // Satellite basemap (Esri World Imagery - free, no API key required)
  var satellite = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
      maxZoom: 22,
      maxNativeZoom: 19,
      attribution: 'Esri, Maxar, Earthstar Geographics'
    }
  ).addTo(map);

  // Your hi-res orthomosaic tile overlay
  var orthomosaic = L.tileLayer(
    'https://pornzpower.github.io/Nobles_Pit_2/{z}/{x}/{y}.png',
    {
      minZoom: 14,
      maxZoom: 22,
      tms: false,
      attribution: 'Created by QGIS',
      opacity: 1
    }
  ).addTo(map);

  // Layer control to toggle satellite base and adjust overlay visibility
  var baseLayers = {
    "Satellite (Esri)": satellite
  };
  var overlayLayers = {
    "Nobles Pit 2 Orthomosaic": orthomosaic
  };
  L.control.layers(baseLayers, overlayLayers).addTo(map);
</script>
</body>
</html>
